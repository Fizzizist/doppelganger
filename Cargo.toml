[package]
name = "doppelganger"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
clap = { version = "4.6.1", features = ["derive"] }
git2 = "0.21.0"
insta = { version = "1.47.2", features = ["yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "macros", "rt-multi-thread"] }
turso = "0.6.1"
