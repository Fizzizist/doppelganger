[package]
name = "doppelganger"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
git2 = "0.21.0"
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-markdown = "0.3.7"
turso = "0.6.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.47.2"
predicates = "3.1.4"
tempfile = "3.27.0"
