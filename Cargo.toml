[package]
name = "doppelganger"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures-util = "0.3.32"
git2 = "0.21.0"
hjkl-buffer = "0.32.0"
hjkl-editor-tui = "0.32.0"
hjkl-engine = "0.32.0"
hjkl-form = "0.32.0"
octocrab = { version = "0.53.1", features = ["stream"] }
pulldown-cmark = "0.13.4"
ratatui = "0.30.1"
ratatui-crossterm = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syntect = "5.3.0"
syntect-assets = "0.23.6"
tempfile = "3.27.0"
the-other-tui-markdown = { git = "https://github.com/Fizzizist/the-other-tui-markdown.git", branch = "main", version = "0.1.0" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turso = "0.6.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.47.2"
predicates = "3.1.4"
tempfile = "3.27.0"
