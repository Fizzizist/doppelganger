[package]
name = "doppelganger"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.32"
git2 = "0.21.0"
minimad = "0.13"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
turso = "0.6.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.47.2"
predicates = "3.1.4"
tempfile = "3.27.0"
